<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ASMR Slime & Squishy Simulator (Gooey Putty & Soft Bodies)</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(18, 26, 43, 0.85);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #f43f5e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0b0f19 65%, #030712 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* Ambient studio background glow */
    .bg-ambience {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 650px;
      height: 650px;
      background: radial-gradient(circle, rgba(244, 63, 94, 0.1) 0%, rgba(168, 85, 247, 0.04) 50%, transparent 70%);
      pointer-events: none;
      z-index: 1;
    }

    /* Top Bar */
    .top-bar {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      backdrop-filter: blur(20px);
      background: rgba(11, 17, 33, 0.75);
      border-bottom: 1px solid var(--border);
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      font-size: 26px;
      filter: drop-shadow(0 0 12px rgba(244, 63, 94, 0.6));
    }

    .logo-titles h1 {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #fbcfe8, #fda4af, #e879f9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo-titles p {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .stats-group {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .stress-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 140px;
    }

    .stress-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .stress-track {
      height: 7px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      overflow: hidden;
    }

    .stress-fill {
      height: 100%;
      width: 95%;
      background: linear-gradient(90deg, #10b981, #f59e0b, #ef4444);
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .squish-counter {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #fed7aa;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Main Interactive Table / Mat Arena */
    .table-arena {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }

    #slimeCanvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }

    #slimeCanvas:active {
      cursor: grabbing;
    }

    /* Floating ASMR Pop / Squelch Text */
    .asmr-float {
      position: absolute;
      pointer-events: none;
      font-weight: 800;
      font-size: 1.1rem;
      color: #fff;
      text-shadow: 0 0 12px rgba(244, 63, 94, 0.9), 0 2px 4px rgba(0,0,0,0.8);
      animation: floatUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      z-index: 30;
    }

    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(0) scale(0.65); }
      20% { opacity: 1; transform: translateY(-12px) scale(1.18); }
      100% { opacity: 0; transform: translateY(-38px) scale(0.9); }
    }

    .hint-banner {
      position: absolute;
      top: 18px;
      pointer-events: none;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.75);
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(14px);
      padding: 6px 18px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 25;
    }

    /* Bottom Control Tray */
    .bottom-dock {
      position: relative;
      z-index: 10;
      backdrop-filter: blur(20px);
      background: rgba(11, 17, 33, 0.88);
      border-top: 1px solid var(--border);
      padding: 12px 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Slimes vs Squishies Category Tabs */
    .category-tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .cat-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 18px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .cat-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .cat-btn.active {
      background: linear-gradient(135deg, rgba(244, 63, 94, 0.25), rgba(168, 85, 247, 0.25));
      border-color: rgba(244, 63, 94, 0.7);
      color: #fff;
      box-shadow: 0 0 16px rgba(244, 63, 94, 0.35);
    }

    .items-carousel {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      justify-content: center;
      scrollbar-width: none;
      padding: 2px 4px;
    }

    .items-carousel::-webkit-scrollbar {
      display: none;
    }

    .item-card {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      white-space: nowrap;
    }

    .item-card:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
    }

    .item-card.active {
      background: linear-gradient(135deg, rgba(244, 63, 94, 0.25), rgba(168, 85, 247, 0.2));
      border-color: #f43f5e;
      box-shadow: 0 0 16px rgba(244, 63, 94, 0.35);
      transform: translateY(-2px);
    }

    .card-swatch {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.4), 0 3px 6px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
    }

    .card-text h4 {
      font-size: 0.8rem;
      font-weight: 700;
      color: #fff;
    }

    .card-text span {
      font-size: 0.65rem;
      color: var(--text-muted);
    }

    /* Tools Bar */
    .tools-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 8px;
    }

    .btn-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tool-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s;
    }

    .tool-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }

    .tool-btn.active {
      background: rgba(244, 63, 94, 0.25);
      border-color: #f43f5e;
      color: #fda4af;
    }

    .charm-btn {
      background: linear-gradient(135deg, #a855f7, #ec4899);
      color: #fff;
      border: none;
    }
  </style>
</head>
<body>

  <script>
    /* =====================================================================
       ASMR PROCEDURAL AUDIO SYNTHESIZER
       Rich wet suction plunges, bubble crunches, and soft foam squishes
       ===================================================================== */
    class SlimeAudio {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      }

      // 1. Wet Finger Poke & Suction (SCHLUCK / PLOP)
      playPlunge(intensity = 1.0, pitchMod = 1.0) {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;

        const t = this.ctx.currentTime;
        // Sub bass weight
        const sub = this.ctx.createOscillator();
        const subGain = this.ctx.createGain();
        sub.type = 'sine';
        sub.frequency.setValueAtTime(65 * pitchMod, t);
        sub.frequency.exponentialRampToValueAtTime(32, t + 0.11);
        subGain.gain.setValueAtTime(0.24 * intensity, t);
        subGain.gain.exponentialRampToValueAtTime(0.001, t + 0.11);
        sub.connect(subGain);
        subGain.connect(this.ctx.destination);
        sub.start(t);
        sub.stop(t + 0.12);

        // Wet suction formant
        const osc = this.ctx.createOscillator();
        const filter = this.ctx.createBiquadFilter();
        const gain = this.ctx.createGain();

        osc.type = 'triangle';
        const startF = (190 + Math.random() * 50) * pitchMod;
        osc.frequency.setValueAtTime(startF, t);
        osc.frequency.linearRampToValueAtTime(startF * 2.6, t + 0.035);
        osc.frequency.exponentialRampToValueAtTime(55, t + 0.16);

        filter.type = 'bandpass';
        filter.Q.value = 5.5;
        filter.frequency.setValueAtTime(360 * pitchMod, t);
        filter.frequency.exponentialRampToValueAtTime(1400 * pitchMod, t + 0.04);
        filter.frequency.exponentialRampToValueAtTime(200, t + 0.18);

        gain.gain.setValueAtTime(0.2 * intensity, t);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(t);
        osc.stop(t + 0.19);
      }

      // 2. Trapped Bubble Crunch / Crackle
      playBubbleCrack() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;

        const count = 2 + Math.floor(Math.random() * 2);
        for (let i = 0; i < count; i++) {
          const t = this.ctx.currentTime + (i * 0.024);
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          const f = 1100 + Math.random() * 450 - (i * 120);
          osc.frequency.setValueAtTime(f, t);
          osc.frequency.exponentialRampToValueAtTime(140, t + 0.035);
          gain.gain.setValueAtTime(0.22, t);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.045);
        }
      }

      // 3. Memory foam compression hiss
      playFoamPress() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;

        const t = this.ctx.currentTime;
        const bufferSize = this.ctx.sampleRate * 0.12;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.5));
        }

        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(500, t);
        filter.frequency.linearRampToValueAtTime(250, t + 0.12);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.12, t);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start(t);
      }

      // 4. Zen Chime
      playZenChime() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;

        const notes = [523.25, 659.25, 783.99, 1046.50];
        const f = notes[Math.floor(Math.random() * notes.length)];
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(f, t);
        gain.gain.setValueAtTime(0.045, t);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.7);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.75);
      }
    }

    const audio = new SlimeAudio();

    /* =====================================================================

    /* =====================================================================
       ORGANIC VISCOUS MESH SIMULATOR
       Organic Puddle & Soft Body Contour (ZERO BOUNCING, PURE OOZE & SQUISH)
       ===================================================================== */
    class OrganicSlimeBody {
      constructor(cx, cy, baseRadius, numPoints = 60) {
        this.cx = cx;
        this.cy = cy;
        this.baseRadius = baseRadius;
        this.numPoints = numPoints;
        this.preset = SLIME_PRESETS[0];

        this.vertices = [];
        this.dents = [];
        this.bubbles = [];
        this.charms = [];
        this.tendril = null;

        this.initShape();
        this.initBubbles();
      }

      initShape() {
        this.vertices = [];
        this.dents = [];
        this.tendril = null;

        for (let i = 0; i < this.numPoints; i++) {
          const ang = (i / this.numPoints) * Math.PI * 2;
          let r = this.baseRadius;

          if (this.preset.category === 'slime') {
            // Authentic organic puddle: wider than tall, with melting liquid lobes
            const puddleWobble = (
              0.16 * Math.sin(ang) +                // slightly wider bottom pool
              0.12 * Math.cos(ang * 2) +            // wide oval shape
              0.08 * Math.sin(ang * 3 + 1.2) -      // organic molten liquid lobes
              0.06 * Math.cos(ang * 4)
            );
            r = this.baseRadius * (1 + puddleWobble);
          } else if (this.preset.shape === 'paw') {
            // Cat paw shape
            const bump = Math.sin(ang * 4) * (this.baseRadius * 0.14);
            if (ang > Math.PI) r += Math.max(0, bump);
            r *= 0.92;
          } else if (this.preset.shape === 'bear') {
            // Bear with round ears
            const ear1 = Math.exp(-Math.pow(ang - 4.1, 2) / 0.18);
            const ear2 = Math.exp(-Math.pow(ang - 5.3, 2) / 0.18);
            r += (ear1 + ear2) * (this.baseRadius * 0.44);
          }

          this.vertices.push({
            ang: ang,
            baseR: r,
            curR: r,
            targetR: r,
            vx: 0,
            vy: 0,
            x: this.cx + Math.cos(ang) * r,
            y: this.cy + Math.sin(ang) * r
          });
        }
      }

      setPreset(preset) {
        this.preset = preset;
        this.initShape();
        this.initBubbles();
      }

      initBubbles() {
        this.bubbles = [];
        for (let i = 0; i < this.preset.bubbles; i++) {
          const d = (Math.random() * 0.65 + 0.1) * this.baseRadius;
          const a = Math.random() * Math.PI * 2;
          this.bubbles.push({
            rRatio: d / this.baseRadius,
            ang: a,
            size: 8 + Math.random() * 12,
            x: this.cx + Math.cos(a) * d,
            y: this.cy + Math.sin(a) * d,
            pulse: Math.random() * Math.PI * 2,
            popping: false,
            pProg: 0
          });
        }
      }

      addCharm(emoji = '🍓') {
        const d = (Math.random() * 0.55 + 0.1) * this.baseRadius;
        const a = Math.random() * Math.PI * 2;
        this.charms.push({
          emoji: emoji,
          rRatio: d / this.baseRadius,
          ang: a,
          size: 28 + Math.random() * 8,
          x: this.cx + Math.cos(a) * d,
          y: this.cy + Math.sin(a) * d,
          rot: (Math.random() - 0.5) * 0.5
        });
      }

      // External Force Applied (Poke, Squish, Drag)
      applyPoke(px, py, radius = 46, depth = 1.0) {
        // Check bubble popping
        let bubbleHit = false;
        for (const b of this.bubbles) {
          if (!b.popping && Math.hypot(px - b.x, py - b.y) < b.size * 1.6) {
            b.popping = true;
            bubbleHit = true;
            audio.playBubbleCrack();
            spawnAsmrWord(b.x, b.y, '💥 POP!');
            break;
          }
        }

        // Add persistent visual dent record
        this.dents.push({
          x: px,
          y: py,
          radius: radius,
          depth: depth,
          life: 1.0
        });
        if (this.dents.length > 16) this.dents.shift();

        // Viscoelastic deformation (Volume conservation & zero harmonic bouncing)
        const dxCenter = px - this.cx;
        const dyCenter = py - this.cy;
        const distCenter = Math.hypot(dxCenter, dyCenter);

        for (const v of this.vertices) {
          const d = Math.hypot(v.x - px, v.y - py);
          if (d < radius * 1.7) {
            const factor = Math.cos((d / (radius * 1.7)) * (Math.PI / 2));
            // Push outwards away from finger
            const nx = (v.x - px) / (d + 1);
            const ny = (v.y - py) / (d + 1);
            v.vx += nx * 14 * factor * depth;
            v.vy += ny * 14 * factor * depth;

            // Indent target radius (plastic flow)
            if (this.preset.plasticFlow > 0) {
              v.targetR = Math.max(this.baseRadius * 0.4, v.targetR - 10 * factor * this.preset.plasticFlow);
            }
          } else {
            // Volume conservation: if center is pushed down, bulge opposite sides!
            if (distCenter < this.baseRadius * 0.6) {
              v.curR += 1.4;
            }
          }
        }

        return bubbleHit;
      }

      // Taffy Stretch Pull
      startTendril(px, py) {
        this.tendril = {
          startX: px, startY: py,
          curX: px, curY: py,
          width: 32, released: false,
          dissolve: 1.0, vy: 0
        };
        audio.playPlunge(0.8);
      }

      updateTendril(px, py) {
        if (!this.tendril || this.tendril.released) return;
        this.tendril.curX = px;
        this.tendril.curY = py;

        // Pull neighboring vertices towards drag
        for (const v of this.vertices) {
          const d = Math.hypot(v.x - px, v.y - py);
          if (d < 110) {
            const f = (1 - d / 110) * 0.35;
            v.vx += (px - v.x) * f * 0.2;
            v.vy += (py - v.y) * f * 0.2;
            if (this.preset.plasticFlow > 0) {
              v.targetR += f * 5 * this.preset.plasticFlow;
            }
          }
        }
      }

      releaseTendril() {
        if (!this.tendril || this.tendril.released) return;
        this.tendril.released = true;
        audio.playPlunge(0.7);
      }

      update() {
        const { stiffness, damping, plasticFlow } = this.preset;

        // 1. Critically Damped Soft-Body Physics (ZERO BOUNCING)
        for (let i = 0; i < this.vertices.length; i++) {
          const v = this.vertices[i];
          const prev = this.vertices[(i - 1 + this.numPoints) % this.numPoints];
          const next = this.vertices[(i + 1) % this.numPoints];

          // Target Cartesian position
          const targetX = this.cx + Math.cos(v.ang) * v.targetR;
          const targetY = this.cy + Math.sin(v.ang) * v.targetR;

          // Hooke's Law + Heavy Critical Damping
          const fx = (targetX - v.x) * stiffness;
          const fy = (targetY - v.y) * stiffness;

          // Surface tension smoothing without vibration
          const smoothX = ((prev.x + next.x) * 0.5 - v.x) * 0.22;
          const smoothY = ((prev.y + next.y) * 0.5 - v.y) * 0.22;

          v.vx = (v.vx + fx + smoothX) * damping;
          v.vy = (v.vy + fy + smoothY) * damping;

          v.x += v.vx;
          v.y += v.vy;

          // Compute current radius from center
          v.curR = Math.hypot(v.x - this.cx, v.y - this.cy);

          // Viscous plastic creep: targetR slowly relaxes to baseR (oozes flat)
          const relaxSpeed = (this.preset.category === 'slime') ? 0.015 : 0.05;
          v.targetR += (v.baseR - v.targetR) * relaxSpeed;
        }

        // 2. Update persistent dents
        for (let i = this.dents.length - 1; i >= 0; i--) {
          const d = this.dents[i];
          d.life -= 0.012;
          d.depth *= 0.985;
          if (d.life <= 0) this.dents.splice(i, 1);
        }

        // 3. Update tendril if active
        if (this.tendril && this.tendril.released) {
          this.tendril.vy += 0.85;
          this.tendril.curY += this.tendril.vy;
          this.tendril.curX += (this.cx - this.tendril.curX) * 0.08;
          this.tendril.dissolve -= 0.045;
          if (this.tendril.dissolve <= 0) this.tendril = null;
        }

        // 4. Update trapped air bubbles
        for (let i = this.bubbles.length - 1; i >= 0; i--) {
          const b = this.bubbles[i];
          b.pulse += 0.05;
          const rad = b.rRatio * this.baseRadius;
          const tx = this.cx + Math.cos(b.ang) * rad;
          const ty = this.cy + Math.sin(b.ang) * rad;
          b.x += (tx - b.x) * 0.08;
          b.y += (ty - b.y) * 0.08;

          if (b.popping) {
            b.pProg += 0.14;
            if (b.pProg >= 1.0) {
              this.bubbles.splice(i, 1);
              if (this.preset.category === 'slime') {
                setTimeout(() => {
                  const d = (Math.random() * 0.65 + 0.1) * this.baseRadius;
                  const a = Math.random() * Math.PI * 2;
                  this.bubbles.push({
                    rRatio: d / this.baseRadius,
                    ang: a,
                    size: 8 + Math.random() * 11,
                    x: this.cx + Math.cos(a) * d,
                    y: this.cy + Math.sin(a) * d,
                    pulse: 0,
                    popping: false,
                    pProg: 0
                  });
                }, 2200 + Math.random() * 2500);
              }
            }
          }
        }

        // 5. Update charms
        for (const c of this.charms) {
          const rad = c.rRatio * this.baseRadius;
          const tx = this.cx + Math.cos(c.ang) * rad;
          const ty = this.cy + Math.sin(c.ang) * rad;
          c.x += (tx - c.x) * 0.06;
          c.y += (ty - c.y) * 0.06;
        }
      }

      draw(ctx) {
        if (this.vertices.length < 3) return;

        ctx.save();

        // 1. Soft Ambient Drop Shadow on table
        ctx.shadowColor = 'rgba(0, 0, 0, 0.55)';
        ctx.shadowBlur = 35;
        ctx.shadowOffsetY = 18;

        // 2. Smooth Catmull-Rom like Viscous Contour
        ctx.beginPath();
        const startX = (this.vertices[0].x + this.vertices[this.numPoints - 1].x) / 2;
        const startY = (this.vertices[0].y + this.vertices[this.numPoints - 1].y) / 2;
        ctx.moveTo(startX, startY);

        for (let i = 0; i < this.numPoints; i++) {
          const curr = this.vertices[i];
          const next = this.vertices[(i + 1) % this.numPoints];
          const midX = (curr.x + next.x) / 2;
          const midY = (curr.y + next.y) / 2;
          ctx.quadraticCurveTo(curr.x, curr.y, midX, midY);
        }
        ctx.closePath();

        // Rich 3D Liquid Gel Lighting
        const grad = ctx.createRadialGradient(
          this.cx - this.baseRadius * 0.35,
          this.cy - this.baseRadius * 0.4,
          this.baseRadius * 0.08,
          this.cx,
          this.cy + 15,
          this.baseRadius * 1.35
        );
        grad.addColorStop(0, this.preset.colorLight);
        grad.addColorStop(0.48, this.preset.color);
        grad.addColorStop(1, this.preset.colorDark);

        ctx.fillStyle = grad;
        ctx.fill();

        ctx.restore();

        // 3. Stretchy Taffy Tendril
        if (this.tendril) {
          const t = this.tendril;
          ctx.save();
          ctx.globalAlpha = Math.max(0, t.dissolve);
          const midX = (t.startX + t.curX) / 2;
          const sagY = (t.startY + t.curY) / 2 + Math.hypot(t.curX - t.startX, t.curY - t.startY) * 0.22;

          ctx.beginPath();
          ctx.moveTo(t.startX - t.width * 0.5, t.startY);
          ctx.quadraticCurveTo(midX, sagY, t.curX, t.curY);
          ctx.quadraticCurveTo(midX, sagY - 10, t.startX + t.width * 0.5, t.startY);
          ctx.closePath();

          ctx.fillStyle = this.preset.color;
          ctx.shadowColor = 'rgba(0,0,0,0.45)';
          ctx.shadowBlur = 16;
          ctx.fill();

          ctx.strokeStyle = `rgba(255, 255, 255, ${this.preset.gloss * 0.65})`;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(t.startX, t.startY);
          ctx.quadraticCurveTo(midX, sagY - 4, t.curX, t.curY);
          ctx.stroke();
          ctx.restore();
        }

        // 4. Clip Inside Body for Dents, Bubbles & Charms
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        for (let i = 0; i < this.numPoints; i++) {
          const curr = this.vertices[i];
          const next = this.vertices[(i + 1) % this.numPoints];
          ctx.quadraticCurveTo(curr.x, curr.y, (curr.x + next.x) / 2, (curr.y + next.y) / 2);
        }
        ctx.closePath();
        ctx.clip();

        // Draw Finger Dents / Depressions
        for (const d of this.dents) {
          const r = d.radius * (0.8 + 0.2 * d.life);
          const alpha = d.life * d.depth;

          const dg = ctx.createRadialGradient(d.x, d.y, r * 0.15, d.x, d.y, r);
          dg.addColorStop(0, `rgba(0,0,0,${0.65 * alpha})`);
          dg.addColorStop(0.7, `rgba(0,0,0,${0.35 * alpha})`);
          dg.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = dg;
          ctx.beginPath();
          ctx.arc(d.x, d.y, r, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = `rgba(255,255,255,${0.45 * alpha * this.preset.gloss})`;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(d.x, d.y, r * 0.95, Math.PI * 0.85, Math.PI * 1.85);
          ctx.stroke();
        }

        // Draw Trapped Air Bubbles
        for (const b of this.bubbles) {
          if (b.popping) {
            ctx.strokeStyle = `rgba(255,255,255,${1 - b.pProg})`;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.size * (1 + b.pProg * 1.6), 0, Math.PI * 2);
            ctx.stroke();
          } else {
            const rad = b.size + Math.sin(b.pulse) * 1.2;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.22)';
            ctx.beginPath();
            ctx.arc(b.x, b.y, rad, 0, Math.PI * 2);
            ctx.fill();

            // Glass specular dot
            ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
            ctx.beginPath();
            ctx.arc(b.x - rad * 0.3, b.y - rad * 0.3, rad * 0.26, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        // Draw Embedded Charms
        for (const c of this.charms) {
          ctx.save();
          ctx.translate(c.x, c.y);
          ctx.rotate(c.rot);
          ctx.font = `${c.size}px -apple-system, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.shadowColor = 'rgba(0,0,0,0.45)';
          ctx.shadowBlur = 6;
          ctx.fillText(c.emoji, 0, 0);
          ctx.restore();
        }

        // Squishy Specifics: Cat Paw Pads or Bear Face
        if (this.preset.shape === 'paw') {
          this.drawCatPads(ctx);
        } else if (this.preset.shape === 'bear') {
          this.drawBearFace(ctx);
        }

        ctx.restore();

        // 5. Glossy Wet Specular Sheen (Curved highlights that reflect room lights)
        if (this.preset.gloss > 0.3) {
          ctx.save();
          ctx.fillStyle = `rgba(255, 255, 255, ${this.preset.gloss * 0.55})`;

          // Primary wide glossy shine
          ctx.beginPath();
          ctx.ellipse(
            this.cx - this.baseRadius * 0.32,
            this.cy - this.baseRadius * 0.45,
            this.baseRadius * 0.42,
            this.baseRadius * 0.16,
            -Math.PI / 8,
            0,
            Math.PI * 2
          );
          ctx.fill();

          // Secondary specular glint
          ctx.beginPath();
          ctx.arc(
            this.cx - this.baseRadius * 0.52,
            this.cy - this.baseRadius * 0.25,
            this.baseRadius * 0.08,
            0,
            Math.PI * 2
          );
          ctx.fill();

          ctx.restore();
        }
      }

      drawCatPads(ctx) {
        ctx.fillStyle = '#ff7b90';
        ctx.shadowColor = 'rgba(0,0,0,0.2)';
        ctx.shadowBlur = 8;
        // Central heart/bean pad
        ctx.beginPath();
        ctx.ellipse(this.cx, this.cy + 18, 44, 34, 0, 0, Math.PI * 2);
        ctx.fill();
        // 3 toe bean pads
        [-0.65, 0, 0.65].forEach(a => {
          const tx = this.cx + Math.sin(a) * 60;
          const ty = this.cy - 30 - Math.cos(a) * 16;
          ctx.beginPath();
          ctx.arc(tx, ty, 16, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      drawBearFace(ctx) {
        ctx.fillStyle = '#854d0e';
        ctx.beginPath();
        ctx.arc(this.cx - 36, this.cy - 12, 6, 0, Math.PI * 2);
        ctx.arc(this.cx + 36, this.cy - 12, 6, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#fff7ed';
        ctx.beginPath();
        ctx.ellipse(this.cx, this.cy + 12, 22, 16, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#451a03';
        ctx.beginPath();
        ctx.arc(this.cx, this.cy + 6, 5, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    /* =====================================================================
       APP SETUP & EVENT HANDLING
       ===================================================================== */
    const canvas = document.getElementById('slimeCanvas');
    const ctx = canvas.getContext('2d');
    const arena = document.getElementById('tableArena');

    let width = 0, height = 0;
    let body = null;

    function resize() {
      const rect = arena.getBoundingClientRect();
      width = rect.width;
      height = rect.height;
      const dpr = window.devicePixelRatio || 1;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.resetTransform();
      ctx.scale(dpr, dpr);

      const rad = Math.min(width, height) * 0.28;
      if (!body) {
        body = new OrganicSlimeBody(width / 2, height / 2, rad);
      } else {
        body.cx = width / 2;
        body.cy = height / 2;
        body.baseRadius = rad;
      }
    }

    window.addEventListener('resize', resize);
    resize();

    // Tools & Modes
    let activeTool = 'squish'; // 'squish' | 'multi' | 'stretch'
    let isInteracting = false;
    let lastX = 0, lastY = 0;
    let squishTotal = 0;
    let stress = 95;

    function getCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: cx - rect.left, y: cy - rect.top };
    }

    function spawnAsmrWord(x, y, text) {
      const el = document.createElement('div');
      el.className = 'asmr-float';
      el.textContent = text;
      el.style.left = `${x}px`;
      el.style.top = `${y}px`;
      arena.appendChild(el);
      setTimeout(() => el.remove(), 850);
    }

    function recordSquishAction(x, y) {
      squishTotal++;
      document.getElementById('squishCountText').textContent = squishTotal;

      stress = Math.max(5, stress - 1.5);
      const strText = `${Math.round(stress)}%`;
      document.getElementById('stressPctText').textContent = strText;
      document.getElementById('stressFill').style.width = strText;

      if (body.preset.category === 'slime') {
        audio.playPlunge(1.0);
      } else {
        audio.playFoamPress();
      }

      if (squishTotal % 10 === 0) {
        audio.playZenChime();
        spawnAsmrWord(x, y, '✨ Zen Flow (-10% Stress)');
      } else if (Math.random() < 0.25) {
        const WORDS = ['🫧 Schluck!', '💖 Squelch', '✨ Deep Poke', '🍯 Pure Ooze', '☁️ Melty', '🧸 So Soft'];
        spawnAsmrWord(x, y, WORDS[Math.floor(Math.random() * WORDS.length)]);
      }
    }

    // Touch & Mouse Handlers
    function handleStart(e) {
      isInteracting = true;
      audio.init();
      const p = getCoords(e);
      lastX = p.x;
      lastY = p.y;

      if (activeTool === 'squish') {
        const hit = body.applyPoke(p.x, p.y, 45, 1.0);
        if (!hit) recordSquishAction(p.x, p.y);
      } else if (activeTool === 'multi') {
        // 5-Finger Claw poke
        const offsets = [{dx:0, dy:0}, {dx:-36, dy:-22}, {dx:36, dy:-22}, {dx:-22, dy:28}, {dx:22, dy:28}];
        offsets.forEach(o => body.applyPoke(p.x + o.dx, p.y + o.dy, 32, 0.9));
        recordSquishAction(p.x, p.y);
        spawnAsmrWord(p.x, p.y, '🖐️ 5-Claw!');
      } else if (activeTool === 'stretch') {
        body.startTendril(p.x, p.y);
      }
    }

    function handleMove(e) {
      if (!isInteracting) return;
      const p = getCoords(e);
      const dx = p.x - lastX;
      const dy = p.y - lastY;
      const speed = Math.hypot(dx, dy);

      if (activeTool === 'squish' && speed > 22) {
        body.applyPoke(p.x, p.y, 38, 0.7);
        if (Math.random() < 0.2) audio.playPlunge(0.5);
        lastX = p.x;
        lastY = p.y;
      } else if (activeTool === 'stretch') {
        body.updateTendril(p.x, p.y);
        lastX = p.x;
        lastY = p.y;
      }
    }

    function handleEnd() {
      if (!isInteracting) return;
      isInteracting = false;
      if (activeTool === 'stretch') {
        body.releaseTendril();
      }
    }

    canvas.addEventListener('mousedown', handleStart);
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', handleEnd);

    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleStart(e); }, { passive: false });
    window.addEventListener('touchmove', (e) => { e.preventDefault(); handleMove(e); }, { passive: false });
    window.addEventListener('touchend', handleEnd);

    /* =====================================================================
       PRESET PICKER SETUP
       ===================================================================== */
    const carousel = document.getElementById('itemsCarousel');
    let activeCategory = 'slime';

    function renderPresets(category) {
      carousel.innerHTML = '';
      const list = category === 'slime' ? SLIME_PRESETS : SQUISHY_PRESETS;

      list.forEach(p => {
        const card = document.createElement('div');
        card.className = `item-card ${body.preset.id === p.id ? 'active' : ''}`;
        card.innerHTML = `
          <div class="card-swatch" style="background: linear-gradient(135deg, ${p.colorLight}, ${p.color});">
            ${p.icon}
          </div>
          <div class="card-text">
            <h4>${p.name}</h4>
            <span>${p.type}</span>
          </div>
        `;

        card.addEventListener('click', () => {
          document.querySelectorAll('.item-card').forEach(c => c.classList.remove('active'));
          card.classList.add('active');
          body.setPreset(p);
          document.getElementById('hintText').textContent = p.hint;
          audio.playPlunge(1.2);
          spawnAsmrWord(width / 2, height / 2 - 30, `Selected ${p.name}!`);
        });

        carousel.appendChild(card);
      });
    }

    document.getElementById('tabSlimes').addEventListener('click', () => {
      activeCategory = 'slime';
      document.getElementById('tabSlimes').classList.add('active');
      document.getElementById('tabSquishies').classList.remove('active');
      renderPresets('slime');
    });

    document.getElementById('tabSquishies').addEventListener('click', () => {
      activeCategory = 'squishy';
      document.getElementById('tabSquishies').classList.add('active');
      document.getElementById('tabSlimes').classList.remove('active');
      renderPresets('squishy');
    });

    renderPresets('slime');

    /* =====================================================================
       TOOLBAR CONTROLS
       ===================================================================== */
    const squishBtn = document.getElementById('toolSquish');
    const multiBtn = document.getElementById('toolMultiPoke');
    const stretchBtn = document.getElementById('toolStretch');

    function setTool(t, btn) {
      activeTool = t;
      [squishBtn, multiBtn, stretchBtn].forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    squishBtn.addEventListener('click', () => setTool('squish', squishBtn));
    multiBtn.addEventListener('click', () => setTool('multi', multiBtn));
    stretchBtn.addEventListener('click', () => setTool('stretch', stretchBtn));

    // Charm Dropper
    const CHARMS = ['🍓', '🍑', '⭐', '🫐', '🌸', '✨', '🍉', '💖', '🍡'];
    document.getElementById('btnAddCharm').addEventListener('click', () => {
      const c = CHARMS[Math.floor(Math.random() * CHARMS.length)];
      body.addCharm(c);
      audio.playPlunge(0.8);
      spawnAsmrWord(body.cx, body.cy, `+ Added ${c} Charm!`);
    });

    // Sound Toggle
    const soundBtn = document.getElementById('btnSound');
    soundBtn.addEventListener('click', () => {
      audio.enabled = !audio.enabled;
      soundBtn.textContent = `🔊 ASMR Audio: ${audio.enabled ? 'ON' : 'OFF'}`;
      soundBtn.classList.toggle('active', audio.enabled);
    });

    // Add Bubbles
    document.getElementById('btnAddBubbles').addEventListener('click', () => {
      body.initBubbles();
      audio.playBubbleCrack();
      spawnAsmrWord(body.cx, body.cy, '🫧 Fresh Bubbles Added!');
    });

    // Reset Shape
    document.getElementById('btnReset').addEventListener('click', () => {
      body.initShape();
      body.initBubbles();
      body.charms = [];
      spawnAsmrWord(body.cx, body.cy, '🔄 Reshaped!');
    });

    /* =====================================================================
       MAIN 60FPS ANIMATION LOOP
       ===================================================================== */
    function animate() {
      ctx.clearRect(0, 0, width, height);

      if (body) {
        body.update();
        body.draw(ctx);
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
