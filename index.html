<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bouncing Ball Physics Simulation</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.85);
      --card-border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #1e293b, #0f172a 80%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow: hidden;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      border-radius: 16px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
    }

    .title-group h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      background: linear-gradient(135deg, #fff 0%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .title-group p {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .status-badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 9999px;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #7dd3fc;
    }

    .canvas-wrapper {
      position: relative;
      width: 100%;
      height: 480px;
      background: #020617;
      cursor: crosshair;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .canvas-hint {
      position: absolute;
      top: 12px;
      left: 12px;
      pointer-events: none;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.4);
      background: rgba(0, 0, 0, 0.5);
      padding: 4px 8px;
      border-radius: 6px;
    }

    .controls-panel {
      padding: 16px 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      background: rgba(15, 23, 42, 0.6);
      border-top: 1px solid var(--card-border);
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .control-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .control-header span:last-child {
      color: var(--accent);
      font-family: monospace;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
      transition: transform 0.1s;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    .actions-bar {
      padding: 12px 20px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      background: rgba(15, 23, 42, 0.6);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    button {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 8px 14px;
      font-size: 0.8rem;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    button.primary {
      background: var(--accent);
      color: #0f172a;
      font-weight: 600;
      border-color: transparent;
    }

    button.primary:hover {
      background: var(--accent-hover);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }

    button.active {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--accent);
      color: #7dd3fc;
    }

    .btn-spacer {
      flex: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title-group">
        <h1>Bouncing Ball Simulation</h1>
        <p>Real-time 2D physics with squash &amp; stretch, momentum, and sound</p>
      </div>
      <div class="status-badge" id="ballCountBadge">1 Ball</div>
    </div>

    <div class="canvas-wrapper" id="canvasWrapper">
      <div class="canvas-hint">Click &amp; drag to fling a ball &bull; Click to add</div>
      <canvas id="canvas"></canvas>
    </div>

    <div class="controls-panel">
      <div class="control-group">
        <div class="control-header">
          <span>Gravity</span>
          <span id="gravityVal">0.60</span>
        </div>
        <input type="range" id="gravitySlider" min="-0.2" max="1.5" step="0.05" value="0.6">
      </div>

      <div class="control-group">
        <div class="control-header">
          <span>Elasticity (Bounce)</span>
          <span id="bounceVal">0.82</span>
        </div>
        <input type="range" id="bounceSlider" min="0.1" max="1.0" step="0.02" value="0.82">
      </div>

      <div class="control-group">
        <div class="control-header">
          <span>Air Friction</span>
          <span id="frictionVal">0.995</span>
        </div>
        <input type="range" id="frictionSlider" min="0.95" max="1.0" step="0.005" value="0.995">
      </div>
    </div>

    <div class="actions-bar">
      <button class="primary" id="addBallBtn">+ Add Ball</button>
      <button id="multiBallBtn">+10 Balls</button>
      <button id="clearBtn">Clear</button>
      
      <div class="btn-spacer"></div>

      <button id="trailBtn" class="active">Trails: ON</button>
      <button id="soundBtn" class="active">Sound: ON</button>
      <button id="zeroGBtn">Zero-G Preset</button>
      <button id="resetPresetBtn">Reset</button>
    </div>
  </div>

  <script>
    // --- Audio Synthesis (Web Audio API) ---
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playBounce(impactSpeed, radius) {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;

        // Base frequency inversely proportional to radius (smaller = higher pitch)
        const baseFreq = Math.max(120, 600 - radius * 10);
        const pitchMultiplier = Math.min(2.0, 0.8 + impactSpeed * 0.05);
        const freq = baseFreq * pitchMultiplier;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq * 0.4), this.ctx.currentTime + 0.12);

        const volume = Math.min(0.35, Math.max(0.02, impactSpeed * 0.015));
        gain.gain.setValueAtTime(volume, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.12);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start();
        osc.stop(this.ctx.currentTime + 0.13);
      }
    }

    const sound = new SoundEngine();

    // --- Ball Physics Class ---
    const PALETTE = [
      { main: '#38bdf8', glow: 'rgba(56, 189, 248, 0.4)', shadow: '#0284c7' },
      { main: '#f43f5e', glow: 'rgba(244, 63, 94, 0.4)',  shadow: '#e11d48' },
      { main: '#a855f7', glow: 'rgba(168, 85, 247, 0.4)', shadow: '#9333ea' },
      { main: '#10b981', glow: 'rgba(16, 185, 129, 0.4)', shadow: '#059669' },
      { main: '#f59e0b', glow: 'rgba(245, 158, 11, 0.4)', shadow: '#d97706' },
      { main: '#ec4899', glow: 'rgba(236, 72, 153, 0.4)', shadow: '#db2777' },
      { main: '#6366f1', glow: 'rgba(99, 102, 241, 0.4)', shadow: '#4f46e5' },
    ];

    class Ball {
      constructor(x, y, radius = 24, vx = (Math.random() - 0.5) * 8, vy = (Math.random() - 0.5) * 4) {
        this.x = x;
        this.y = y;
        this.radius = radius;
        this.vx = vx;
        this.vy = vy;
        this.mass = radius;
        this.color = PALETTE[Math.floor(Math.random() * PALETTE.length)];
        
        // Squash and stretch parameters
        this.scaleX = 1;
        this.scaleY = 1;
        this.rotation = 0;

        // Trail history
        this.history = [];
        this.maxHistory = 15;
      }

      update(gravity, bounce, friction, width, height) {
        // Record trail
        this.history.push({ x: this.x, y: this.y });
        if (this.history.length > this.maxHistory) {
          this.history.shift();
        }

        // Apply forces
        this.vy += gravity;
        this.vx *= friction;
        this.vy *= friction;

        this.x += this.vx;
        this.y += this.vy;

        // Smoothly recover from squash/stretch
        this.scaleX += (1 - this.scaleX) * 0.15;
        this.scaleY += (1 - this.scaleY) * 0.15;

        let collided = false;
        let impactSpeed = 0;

        // Floor collision
        if (this.y + this.radius > height) {
          this.y = height - this.radius;
          impactSpeed = Math.abs(this.vy);
          this.vy = -this.vy * bounce;
          this.vx *= 0.98; // ground rolling friction
          
          if (impactSpeed > 1) {
            this.scaleX = Math.min(1.4, 1 + impactSpeed * 0.02);
            this.scaleY = Math.max(0.6, 1 - impactSpeed * 0.02);
            this.rotation = 0;
            collided = true;
          }
        }

        // Ceiling collision
        if (this.y - this.radius < 0) {
          this.y = this.radius;
          impactSpeed = Math.abs(this.vy);
          this.vy = -this.vy * bounce;
          if (impactSpeed > 1) {
            this.scaleX = Math.min(1.4, 1 + impactSpeed * 0.02);
            this.scaleY = Math.max(0.6, 1 - impactSpeed * 0.02);
            this.rotation = 0;
            collided = true;
          }
        }

        // Right wall
        if (this.x + this.radius > width) {
          this.x = width - this.radius;
          impactSpeed = Math.abs(this.vx);
          this.vx = -this.vx * bounce;
          if (impactSpeed > 1) {
            this.scaleY = Math.min(1.4, 1 + impactSpeed * 0.02);
            this.scaleX = Math.max(0.6, 1 - impactSpeed * 0.02);
            this.rotation = Math.PI / 2;
            collided = true;
          }
        }

        // Left wall
        if (this.x - this.radius < 0) {
          this.x = this.radius;
          impactSpeed = Math.abs(this.vx);
          this.vx = -this.vx * bounce;
          if (impactSpeed > 1) {
            this.scaleY = Math.min(1.4, 1 + impactSpeed * 0.02);
            this.scaleX = Math.max(0.6, 1 - impactSpeed * 0.02);
            this.rotation = Math.PI / 2;
            collided = true;
          }
        }

        if (collided && impactSpeed > 1.2) {
          sound.playBounce(impactSpeed, this.radius);
        }
      }

      draw(ctx, showTrails) {
        // Draw trails
        if (showTrails && this.history.length > 1) {
          for (let i = 0; i < this.history.length - 1; i++) {
            const p1 = this.history[i];
            const p2 = this.history[i + 1];
            const progress = (i + 1) / this.history.length;
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.strokeStyle = this.color.glow;
            ctx.lineWidth = this.radius * 0.6 * progress;
            ctx.lineCap = 'round';
            ctx.stroke();
          }
        }

        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.scale(this.scaleX, this.scaleY);

        // Shadow / Outer Glow
        ctx.shadowColor = this.color.main;
        ctx.shadowBlur = 12;

        // Ball body gradient
        const grad = ctx.createRadialGradient(
          -this.radius * 0.3, -this.radius * 0.3, this.radius * 0.1,
          0, 0, this.radius
        );
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.3, this.color.main);
        grad.addColorStop(1, this.color.shadow);

        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();

        ctx.restore();
      }
    }

    // --- Collision Resolution Between Balls ---
    function resolveBallCollisions(balls) {
      for (let i = 0; i < balls.length; i++) {
        for (let j = i + 1; j < balls.length; j++) {
          const b1 = balls[i];
          const b2 = balls[j];

          const dx = b2.x - b1.x;
          const dy = b2.y - b1.y;
          const dist = Math.hypot(dx, dy);
          const minDist = b1.radius + b2.radius;

          if (dist < minDist && dist > 0) {
            // Overlap resolution
            const overlap = (minDist - dist) / 2;
            const nx = dx / dist;
            const ny = dy / dist;

            b1.x -= nx * overlap;
            b1.y -= ny * overlap;
            b2.x += nx * overlap;
            b2.y += ny * overlap;

            // Elastic 1D collision along normal
            const kx = b1.vx - b2.vx;
            const ky = b1.vy - b2.vy;
            const p = 2 * (nx * kx + ny * ky) / (b1.mass + b2.mass);

            b1.vx -= p * b2.mass * nx;
            b1.vy -= p * b2.mass * ny;
            b2.vx += p * b1.mass * nx;
            b2.vy += p * b1.mass * ny;

            const relativeSpeed = Math.hypot(kx, ky);
            if (relativeSpeed > 1.5) {
              sound.playBounce(relativeSpeed * 0.6, (b1.radius + b2.radius) / 2);
            }
          }
        }
      }
    }

    // --- Canvas & App Setup ---
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const wrapper = document.getElementById('canvasWrapper');

    let width = 0;
    let height = 0;

    function resize() {
      const rect = wrapper.getBoundingClientRect();
      width = rect.width;
      height = rect.height;
      const dpr = window.devicePixelRatio || 1;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.resetTransform();
      ctx.scale(dpr, dpr);
    }

    window.addEventListener('resize', resize);
    resize();

    // App State
    let gravity = 0.6;
    let bounce = 0.82;
    let friction = 0.995;
    let showTrails = true;
    const balls = [];

    // Add initial ball
    function spawnBall(x, y, vx, vy, radius) {
      const r = radius || (18 + Math.random() * 16);
      const b = new Ball(
        x !== undefined ? x : width / 2,
        y !== undefined ? y : height / 3,
        r,
        vx !== undefined ? vx : (Math.random() - 0.5) * 10,
        vy !== undefined ? vy : -2 - Math.random() * 4
      );
      balls.push(b);
      updateBallBadge();
    }

    spawnBall(width / 2, height / 3, 4, -3, 26);

    function updateBallBadge() {
      const badge = document.getElementById('ballCountBadge');
      badge.textContent = balls.length === 1 ? '1 Ball' : `${balls.length} Balls`;
    }

    // --- Interactive Drag & Fling ---
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let dragCurrentX = 0;
    let dragCurrentY = 0;

    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    wrapper.addEventListener('mousedown', (e) => {
      sound.init();
      const p = getCanvasCoords(e);
      isDragging = true;
      dragStartX = p.x;
      dragStartY = p.y;
      dragCurrentX = p.x;
      dragCurrentY = p.y;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const p = getCanvasCoords(e);
      dragCurrentX = p.x;
      dragCurrentY = p.y;
    });

    window.addEventListener('mouseup', () => {
      if (!isDragging) return;
      isDragging = false;

      const dx = dragStartX - dragCurrentX;
      const dy = dragStartY - dragCurrentY;
      const dist = Math.hypot(dx, dy);

      if (dist < 8) {
        // Simple click -> spawn directly with random velocity
        spawnBall(dragStartX, dragStartY);
      } else {
        // Fling slingshot!
        const vx = (dragStartX - dragCurrentX) * 0.15;
        const vy = (dragStartY - dragCurrentY) * 0.15;
        spawnBall(dragStartX, dragStartY, vx, vy);
      }
    });

    // Touch Support
    wrapper.addEventListener('touchstart', (e) => {
      e.preventDefault();
      sound.init();
      const p = getCanvasCoords(e);
      isDragging = true;
      dragStartX = p.x;
      dragStartY = p.y;
      dragCurrentX = p.x;
      dragCurrentY = p.y;
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (!isDragging) return;
      const p = getCanvasCoords(e);
      dragCurrentX = p.x;
      dragCurrentY = p.y;
    }, { passive: true });

    window.addEventListener('touchend', () => {
      if (!isDragging) return;
      isDragging = false;
      const dx = dragStartX - dragCurrentX;
      const dy = dragStartY - dragCurrentY;
      const dist = Math.hypot(dx, dy);

      if (dist < 8) {
        spawnBall(dragStartX, dragStartY);
      } else {
        const vx = (dragStartX - dragCurrentX) * 0.15;
        const vy = (dragStartY - dragCurrentY) * 0.15;
        spawnBall(dragStartX, dragStartY, vx, vy);
      }
    });

    // --- Main Loop ---
    function animate() {
      // Clear with soft background
      ctx.fillStyle = showTrails ? 'rgba(2, 6, 23, 0.3)' : 'rgba(2, 6, 23, 1)';
      ctx.fillRect(0, 0, width, height);

      // Grid decoration
      ctx.save();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.02)';
      ctx.lineWidth = 1;
      const gridSize = 40;
      for (let x = 0; x < width; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
      }
      for (let y = 0; y < height; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }
      ctx.restore();

      // Resolve collisions and update
      resolveBallCollisions(balls);
      for (const ball of balls) {
        ball.update(gravity, bounce, friction, width, height);
        ball.draw(ctx, showTrails);
      }

      // Draw slingshot drag indicator
      if (isDragging) {
        ctx.save();
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.8)';
        ctx.lineWidth = 3;
        ctx.setLineDash([6, 6]);
        ctx.beginPath();
        ctx.moveTo(dragStartX, dragStartY);
        ctx.lineTo(dragCurrentX, dragCurrentY);
        ctx.stroke();

        // Target spawn preview
        ctx.setLineDash([]);
        ctx.fillStyle = 'rgba(56, 189, 248, 0.5)';
        ctx.beginPath();
        ctx.arc(dragStartX, dragStartY, 14, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      requestAnimationFrame(animate);
    }

    animate();

    // --- Controls Hookup ---
    const gravitySlider = document.getElementById('gravitySlider');
    const gravityVal = document.getElementById('gravityVal');
    gravitySlider.addEventListener('input', (e) => {
      gravity = parseFloat(e.target.value);
      gravityVal.textContent = gravity.toFixed(2);
    });

    const bounceSlider = document.getElementById('bounceSlider');
    const bounceVal = document.getElementById('bounceVal');
    bounceSlider.addEventListener('input', (e) => {
      bounce = parseFloat(e.target.value);
      bounceVal.textContent = bounce.toFixed(2);
    });

    const frictionSlider = document.getElementById('frictionSlider');
    const frictionVal = document.getElementById('frictionVal');
    frictionSlider.addEventListener('input', (e) => {
      friction = parseFloat(e.target.value);
      frictionVal.textContent = friction.toFixed(3);
    });

    document.getElementById('addBallBtn').addEventListener('click', () => {
      spawnBall();
    });

    document.getElementById('multiBallBtn').addEventListener('click', () => {
      for (let i = 0; i < 10; i++) {
        spawnBall(
          width * 0.2 + Math.random() * width * 0.6,
          height * 0.1 + Math.random() * height * 0.3
        );
      }
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
      balls.length = 0;
      updateBallBadge();
    });

    const trailBtn = document.getElementById('trailBtn');
    trailBtn.addEventListener('click', () => {
      showTrails = !showTrails;
      trailBtn.textContent = `Trails: ${showTrails ? 'ON' : 'OFF'}`;
      trailBtn.classList.toggle('active', showTrails);
    });

    const soundBtn = document.getElementById('soundBtn');
    soundBtn.addEventListener('click', () => {
      sound.enabled = !sound.enabled;
      soundBtn.textContent = `Sound: ${sound.enabled ? 'ON' : 'OFF'}`;
      soundBtn.classList.toggle('active', sound.enabled);
    });

    document.getElementById('zeroGBtn').addEventListener('click', () => {
      gravity = 0;
      gravitySlider.value = 0;
      gravityVal.textContent = '0.00';
      bounce = 0.99;
      bounceSlider.value = 0.99;
      bounceVal.textContent = '0.99';
      friction = 1.0;
      frictionSlider.value = 1.0;
      frictionVal.textContent = '1.000';
      // give balls a push
      for (const b of balls) {
        b.vx = (Math.random() - 0.5) * 8;
        b.vy = (Math.random() - 0.5) * 8;
      }
    });

    document.getElementById('resetPresetBtn').addEventListener('click', () => {
      gravity = 0.6;
      gravitySlider.value = 0.6;
      gravityVal.textContent = '0.60';
      bounce = 0.82;
      bounceSlider.value = 0.82;
      bounceVal.textContent = '0.82';
      friction = 0.995;
      frictionSlider.value = 0.995;
      frictionVal.textContent = '0.995';
      balls.length = 0;
      spawnBall(width / 2, height / 3, 4, -3, 26);
    });
  </script>
</body>
</html>
